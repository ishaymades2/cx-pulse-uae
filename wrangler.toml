name = "cx-pulse-uae"
main = "src/index.js"
compatibility_date = "2026-11-21"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cx-pulse-uae-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_ENV = "production"
