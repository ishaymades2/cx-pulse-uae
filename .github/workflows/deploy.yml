name: Deploy CX Pulse UAE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cx-pulse-uae-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # The OTP and Resend secrets already live in Cloudflare Worker settings.
      # They are deliberately not copied into GitHub Actions.
      - name: Check Cloudflare deployment credentials
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deployment skipped. Add these GitHub Actions secrets:$missing"
            {
              echo "### CX Pulse deployment skipped"
              echo
              echo "CI tests passed. Production deployment was not attempted because these GitHub Actions secrets are missing:"
              echo
              for name in $missing; do echo "- `$name`"; done
              echo
              echo "Add them under Settings → Secrets and variables → Actions, then run this workflow again."
              echo "The existing Resend API key and OTP pepper remain in Cloudflare Worker secrets and are not copied into GitHub."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending D1 migrations
        if: steps.preflight.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply cx-pulse-uae-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        if: steps.preflight.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health endpoint
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            response="$(curl -fsS https://cx-pulse-uae2.mydailyhub-uae.workers.dev/api/health || true)"
            if echo "$response" | grep -q '"ok":true'; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production health check did not return ok=true."
          exit 1
